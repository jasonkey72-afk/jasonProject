<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PDF로 저장</title>
  <style id="wd-doc-style"></style>
  <style>
    /* 화면에만 보이는 안내 막대 (인쇄물에는 나오지 않는다) */
    #wd-bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: -24px -24px 20px; padding: 12px 20px;
      background: #eef3fc; border-bottom: 1px solid #c7d6f0;
      font-family: "맑은 고딕", "Malgun Gothic", system-ui, sans-serif; font-size: 13px; color: #1b4fa8;
    }
    #wd-bar button {
      font-family: inherit; font-size: 13px; font-weight: 600;
      background: #2d6cdf; color: #fff; border: none; border-radius: 6px;
      padding: 7px 14px; cursor: pointer;
    }
    #wd-bar button:hover { background: #245bbd; }
    #wd-bar .wd-hint { color: #45526b; font-weight: normal; }
    @media print { #wd-bar { display: none !important; } }
  </style>
</head>
<body>
  <div id="wd-bar">
    <button id="wd-print">PDF로 저장 (인쇄)</button>
    <span class="wd-hint">인쇄 창의 <b>대상</b>을 <b>“PDF로 저장”</b>으로 고른 뒤 저장을 누르세요.</span>
  </div>
  <div id="wd-content"></div>
  <script src="print.js"></script>
</body>
</html>
